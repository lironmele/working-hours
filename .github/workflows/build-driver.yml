name: Build WDM Driver

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # The windows-2022 runner ships with Visual Studio 2022 and the Windows
    # Driver Kit (WDK) pre-installed, so the driver builds with MSBuild
    # directly -- no SDK/WDK installation step is required.
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64]

    env:
      SOLUTION: driver/wdmdriver.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build driver (${{ matrix.configuration }}|${{ matrix.platform }})
        shell: pwsh
        run: |
          msbuild $env:SOLUTION `
            /m `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wdmdriver-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            driver/**/${{ matrix.platform }}/${{ matrix.configuration }}/wdmdriver.sys
            driver/**/${{ matrix.platform }}/${{ matrix.configuration }}/wdmdriver.inf
          if-no-files-found: error
